name: release-package

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：指定新版本（如 v0.2.0），留空自动递增补丁版本'
        required: false

concurrency:
  group: release-package
  queue: max

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Select version for this push
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: node scripts/release-version.cjs

      - run: npm ci

      - name: Build versioned release package
        id: pack
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          npm run pack:release
          echo "archive=tabby-ssh-proxy-selector-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Test plugin and macOS installation
        run: |
          npm test
          node tests/install-release.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ steps.pack.outputs.archive }}
          overwrite: true
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Test Windows installation
        shell: bash
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          node tests/install-release.cjs

      - name: Publish tested archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag belongs to another commit. Re-run all jobs to select a new version."
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:refs/tags/$tag"
          fi

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            assets=$(gh release view "$tag" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
            if ! grep -Fxq "$ARCHIVE" <<< "$assets"; then
              gh release upload "$tag" "$ARCHIVE" --clobber
            fi
            if [[ "$draft" == "true" ]]; then
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "$ARCHIVE" --verify-tag --generate-notes
          fi
